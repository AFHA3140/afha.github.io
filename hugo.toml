theme = "hugo-theme-stack"
title = "Hypomnemata"
languageCode = "es-co"
defaultContentLanguage = "es"
enableGitInfo = true

[author]
name = "Felipe Hurtado Agudelo"

[params]
mainSections = ["post"]
rssFullContent = true
description = "Notas, ensayos y fragmentos de un diario público."

[params.footer]
since = 2026
customText = "Un archivo vivo: memoria, cuaderno y laboratorio de ideas."

[params.dateFormat]
published = "2 de January de 2006"
lastUpdated = "2 de January de 2006"

# Stack v4 usa una sola ruta para el avatar.
# La imagen debe estar en assets/img/avatar.png
[params.sidebar]
compact = false
avatar = "img/avatar.png"
subtitle = "Memoria, apuntes y preguntas que vale la pena conservar."

[params.colorScheme]
toggle = true
default = "auto"

[params.article]
headingAnchor = true
toc = true
readingTime = true

[params.article.list]
showTags = true

[params.imageProcessing]
autoOrient = true

[params.imageProcessing.thumbnail]
enabled = true

[params.imageProcessing.content]
enabled = true
widths = [800, 1600, 2400]

[markup]

[markup.goldmark]

[markup.goldmark.renderer]
unsafe = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[params.search]
enabled = true
